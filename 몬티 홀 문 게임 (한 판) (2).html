<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몬티 홀 문 게임 (한 판)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#eef0ff;--ink:#1b1d4a;--muted:#5b5e8a;--door:#2f35a8;--door-edge:#232889;--gold:#f5b21b;--card:#ffffff;--ok:#12803f;--no:#bd3434;--btn:#1b1d4a;--btn-ink:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12143a;--ink:#eceeff;--muted:#a3a7d6;--door:#4b52d6;--door-edge:#353cb8;--card:#1f2257;--ok:#4cd68a;--no:#ff7b7b;--btn:#f5b21b;--btn-ink:#1b1d4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12143a;--ink:#eceeff;--muted:#a3a7d6;--door:#4b52d6;--door-edge:#353cb8;--card:#1f2257;--ok:#4cd68a;--no:#ff7b7b;--btn:#f5b21b;--btn-ink:#1b1d4a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:30px;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.door{aspect-ratio:3/5;border:4px solid var(--door-edge);border-radius:16px 16px 4px 4px;background:var(--door);color:#fff;font:inherit;font-size:44px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.door:not(:disabled):active{transform:scale(.97)}
.door::after{content:"";position:absolute;right:12%;top:52%;width:12px;height:12px;border-radius:50%;background:var(--gold)}
.door.open{background:var(--card);color:var(--ink);border-color:var(--door-edge)}
.door.open::after{display:none}
.door.picked{outline:5px solid var(--gold);outline-offset:3px}
.door:disabled{cursor:default}
.door:focus-visible,.btn:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.tag{display:block;font-size:14px;text-align:center;margin-top:6px;min-height:21px;color:var(--muted)}
.msg{font-size:20px;margin:22px 0 14px;min-height:60px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:18px;padding:12px 20px;border-radius:12px;border:2px solid var(--btn);background:var(--btn);color:var(--btn-ink);cursor:pointer;flex:1;min-width:130px}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
.res.ok{color:var(--ok)}.res.no{color:var(--no)}
.panel{background:var(--card);border-radius:16px;padding:16px;margin-top:24px}
.panel h2{font-size:20px;margin:0 0 8px}
.bar{margin:8px 0}.bar b{font-weight:400}
.track{height:22px;background:var(--bg);border-radius:11px;overflow:hidden}
.fill{height:100%;background:var(--door);border-radius:11px;transition:width .6s}
.fill.sw{background:var(--gold)}
.small{color:var(--muted);font-size:15px;margin:6px 0 0}
.dots{width:100%;display:block;margin-top:6px}
</style>
</head>
<body>
<main>
  <h1>🚪 몬티 홀 문 게임</h1>
  <p class="sub">문 3개 중 하나 뒤에는 자동차, 나머지 둘 뒤에는 염소가 있어요. 첫 판 결과로 집계하고, 그 뒤엔 마음껏 다시 해봐도 돼요.</p>
  <div class="doors" id="doors"></div>
  <div class="msg" id="msg"></div>
  <div class="row" id="actions"></div>

</main>
<script>
var R=function(n){return Math.floor(Math.random()*n)};
var car,pick,opened,phase;
var st={stay:[0,0],sw:[0,0]};
var $=function(id){return document.getElementById(id)};

function start(){car=R(3);pick=null;opened=null;phase=0;draw()}

function draw(){
  var html='';
  for(var i=0;i<3;i++){
    var isOpen=(phase===2)||(i===opened);
    var face=isOpen?(i===car?'🚗':'🐐'):(i+1);
    var cls='door'+(isOpen?' open':'')+(i===pick?' picked':'');
    var dis=(phase!==0)?' disabled':'';
    var tag='';
    if(phase>=1&&i===pick&&phase!==2)tag='내가 고른 문';
    if(phase===2&&i===pick)tag='내가 고른 문';
    html+='<div><button class="'+cls+'" data-i="'+i+'"'+dis+' aria-label="'+(i+1)+'번 문">'+face+'</button><span class="tag">'+tag+'</span></div>';
  }
  $('doors').innerHTML=html;
  var btns=$('doors').querySelectorAll('button');
  for(var k=0;k<btns.length;k++){btns[k].onclick=function(){choose(+this.getAttribute('data-i'))}}
  if(phase===0){$('msg').innerHTML='자동차가 있을 것 같은 문을 눌러 보세요.';$('actions').innerHTML=''}
  else if(phase===1){
    $('msg').innerHTML=(pick+1)+'번 문을 골랐어요. 진행자가 '+(opened+1)+'번 문을 열었더니 염소가 있네요! 남은 문은 하나예요. 바꿀까요?';
    $('actions').innerHTML='<button class="btn alt" id="stayB">그대로 유지</button><button class="btn" id="swB">바꾸기</button>';
    $('stayB').onclick=function(){fin(false)};$('swB').onclick=function(){fin(true)};
  }
}

function choose(i){
  pick=i;
  var c=[];for(var j=0;j<3;j++){if(j!==pick&&j!==car)c.push(j)}
  opened=c[R(c.length)];
  phase=1;draw();
}

function fin(sw){
  var finalPick=sw?[0,1,2].filter(function(x){return x!==pick&&x!==opened})[0]:pick;
  var win=finalPick===car;
  var key=sw?'sw':'stay';
  st[key][0]++;if(win)st[key][1]++;
  pick=finalPick;phase=2;draw();
  $('msg').innerHTML='<span class="res '+(win?'ok':'no')+'">'+(win?'🎉 자동차 당첨!':'😢 염소였어요…')+'</span><br>'+(sw?'문을 바꿨어요.':'처음 고른 문을 유지했어요.')+'<br><span class="small">'+(st.stay[0]+st.sw[0]===1?'첫 판 결과를 기억해 두세요. 곧 손들기로 집계해요!':'연습 판이에요. 몇 번이든 해봐도 좋아요!')+'</span>';
  $('actions').innerHTML='<button class="btn" id="again">다시 하기</button>';
  $('again').onclick=start;
}

start();
</script>
</body>
</html>
